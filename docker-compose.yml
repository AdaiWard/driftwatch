name: driftwatch

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: driftwatch
      POSTGRES_PASSWORD: driftwatch
      POSTGRES_DB: driftwatch
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U driftwatch -d driftwatch']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: driftwatch
      MINIO_ROOT_PASSWORD: driftwatch-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 40

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 driftwatch driftwatch-secret &&
      mc mb --ignore-existing local/driftwatch"

  demo-app:
    image: nginx:alpine
    volumes:
      - ./demo-app:/usr/share/nginx/html:ro
    ports:
      - '8080:80'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://driftwatch:driftwatch@postgres:5432/driftwatch
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: driftwatch
      S3_REGION: us-east-1
      S3_ACCESS_KEY: driftwatch
      S3_SECRET_KEY: driftwatch-secret
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://driftwatch:driftwatch@postgres:5432/driftwatch
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: driftwatch
      S3_REGION: us-east-1
      S3_ACCESS_KEY: driftwatch
      S3_SECRET_KEY: driftwatch-secret
      WORKER_CONCURRENCY: '2'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  pg-data:
  minio-data: